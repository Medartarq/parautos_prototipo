<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Consulta tu vehículo · PARAUTOS</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;background:#090b0d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#381316,#090b0d 44%)}header{padding:24px max(20px,6vw);border-bottom:1px solid #ffffff22}header img{width:190px;filter:drop-shadow(0 4px 14px #000)}main{max-width:900px;margin:auto;padding:70px 20px}h1{font-size:clamp(32px,6vw,56px);margin:0 0 12px}p{color:#c8cbd0}.card{background:#fff;color:#17212b;border-radius:22px;padding:clamp(20px,5vw,42px);box-shadow:0 30px 80px #0008}.fields{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:grid;gap:7px;font-weight:700}input{height:50px;border:1px solid #ccd2d8;border-radius:11px;padding:12px;font-size:17px;text-transform:uppercase}button{height:50px;border:0;border-radius:11px;padding:0 22px;background:#ed3337;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:28px;padding-top:25px;border-top:1px solid #e1e5e9}.progress{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:65px 0 25px}.progress:before{content:'';position:absolute;left:10%;right:10%;top:13px;height:6px;background:#e5e7eb;border-radius:99px}.fill{position:absolute;left:10%;top:13px;height:6px;background:#ed3337;border-radius:99px;transition:.8s}.stage{z-index:1;text-align:center}.stage i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;margin:auto;font-style:normal;font-weight:800}.stage.done i{background:#ed3337;color:#fff}.stage span{display:block;font-size:12px;margin-top:9px}.car{position:absolute;top:-35px;font-size:30px;transform:translateX(-50%);animation:bob 1s infinite alternate}@keyframes bob{to{transform:translate(-50%,-4px)}}.terminal{padding:17px;border-radius:12px;background:#f5f7fa}.error{color:#c52228;font-weight:700}@media(max-width:650px){main{padding-top:40px}.fields{grid-template-columns:1fr}.progress{margin-top:70px}.stage span{font-size:10px}button{width:100%}}</style></head><body><header><img src="assets/logo_parautos.svg" alt="PARAUTOS"></header><main><h1>Consulta el estado de tu vehículo</h1><p>Ingresa la placa y el código de 8 caracteres entregado al registrar tu vehículo.</p><section class="card"><div class="fields"><label>Placa<input id="plate" value="ABC-240" placeholder="ABC-123"></label><label>Código de consulta<input id="code" value="P4R148AX" maxlength="8" placeholder="XXXXXXXX"></label><button id="search">Consultar</button></div><div id="result"></div></section></main><script src="seguimiento.js"></script></body></html>
