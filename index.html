<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iniciar Sesion - PARAUTOS</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="left-panel"><div class="left-shade"></div><div class="mobile-brand"><img src="assets/logo_parautos.svg" alt="PARAUTOS"></div></div>
    <div class="right-panel"><div class="login-box">
      <div class="desktop-brand"><div class="placeholder-logo"><img src="assets/logo_parautos.svg" height="80" alt="PARAUTOS"></div></div>
      <h2>Inicia sesion</h2><p class="lead">Accede al panel principal.</p>
      <form id="demoLogin">
        <div class="form-group"><label for="demoProfile">Perfil de demostracion</label><select id="demoProfile"><option value="crcavero">Christian Cavero · Asesor</option><option value="camaya">Carlos Amaya · Administrador</option></select></div>
        <div class="form-group"><label for="username">Usuario</label><div class="field-control"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg><input type="text" id="username" value="crcavero" placeholder="Usuario" autocomplete="username" required></div></div>
        <div class="form-group"><label for="password">Contrasena</label><div class="field-control"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Zm3 7a2 2 0 0 1 1 3.73V19h-2v-1.27A2 2 0 0 1 12 14Z"/></svg><input type="password" id="password" value="demo" placeholder="Contrasena" autocomplete="current-password" required></div></div>
        <button type="submit" class="btn-submit">Entrar</button>
      </form>
      <div class="footer"><p>Demostracion navegable sin autenticacion real.</p><p>&copy; 2026 Parautos Soluciones Automotrices</p></div>
    </div></div>
  </div>
  <script>
    const profiles={camaya:{id:1,idRol:1,nombres:'Carlos Amaya',nombreUsuario:'camaya',correo:'admin@parautos.pe',activo:true},crcavero:{id:2,idRol:2,nombres:'Christian Cavero',nombreUsuario:'crcavero',correo:'ccavero@parautos.pe',activo:true}};
    const profile=document.querySelector('#demoProfile'),username=document.querySelector('#username');
    profile.onchange=()=>username.value=profile.value;
    document.querySelector('#demoLogin').onsubmit=event=>{event.preventDefault();const selected=profiles[profile.value]||profiles.crcavero;localStorage.setItem('parautos-apf2-user',JSON.stringify(selected));localStorage.setItem('parautos-apf2-show-pending-alert','true');location.href='panel.html'};
  </script>
</body>
</html>
